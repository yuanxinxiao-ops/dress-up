<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">

<meta itemprop="name" content="李文静的百变衣橱 · 变装小游戏">
<meta itemprop="description" content="换装 + 风格挑战，一秒变装，生成你的专属穿搭海报">
<title>李文静的百变衣橱 · 变装小游戏</title>
<style>
/* ============ 基础重置 ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0);margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:#f6eef4;color:#3d2c40;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit;touch-action:manipulation}
img,svg{display:block}

/* ============ 布局骨架 ============ */
#app{
  position:relative;height:100vh;height:100dvh;max-width:540px;margin:0 auto;
  display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(120% 55% at 50% -8%, #ffffff 0%, rgba(255,255,255,0) 60%),
    linear-gradient(168deg,#fff6f9 0%,#fdeef5 34%,#f4e9fc 70%,#eae6fb 100%);
}
#app::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(circle at 12% 18%, #ffd9e8 0 2px, transparent 3px),
    radial-gradient(circle at 86% 12%, #d9d0ff 0 2px, transparent 3px),
    radial-gradient(circle at 74% 78%, #ffd9e8 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 22% 66%, #cfe4ff 0 1.5px, transparent 2.5px);
}

/* ============ 顶栏 ============ */
header{
  position:relative;z-index:5;flex:0 0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
  display:flex;align-items:center;gap:8px;
}
.logo{
  display:flex;align-items:center;gap:7px;font-weight:800;font-size:17px;letter-spacing:.5px;
  background:linear-gradient(92deg,#e8628f,#a35fd0);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.logo .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(140deg,#ff8ab0,#a86fe0);
  display:grid;place-items:center;font-size:12px;-webkit-text-fill-color:#fff;box-shadow:0 3px 8px rgba(200,90,160,.35)}
.hspacer{flex:1}
.chip{
  height:30px;padding:0 11px;border-radius:15px;background:rgba(255,255,255,.82);
  border:1px solid #f2dcea;font-size:12.5px;font-weight:700;color:#8a5a7a;
  display:flex;align-items:center;gap:5px;box-shadow:0 2px 6px rgba(180,120,160,.10);
}
.chip.on{background:linear-gradient(120deg,#ffe3ee,#f0e2ff);border-color:#f6c9de;color:#c0407e}
.iconbtn{
  width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.82);border:1px solid #f2dcea;
  display:grid;place-items:center;font-size:15px;color:#a06a90;box-shadow:0 2px 6px rgba(180,120,160,.10);
}
.iconbtn:active{transform:scale(.92)}
.iconbtn.off{opacity:.42}

/* 挑战进度条 */
#timerWrap{
  position:absolute;left:12px;right:12px;bottom:-1px;height:4px;border-radius:2px;
  background:rgba(255,255,255,.6);overflow:hidden;opacity:0;transition:opacity .3s;
}
#timerWrap.on{opacity:1}
#timerBar{height:100%;width:100%;border-radius:2px;background:linear-gradient(90deg,#ff7fa8,#b06fe8);transition:width .25s linear}
#timerWrap.warn #timerBar{background:linear-gradient(90deg,#ff5d5d,#ff9f43)}

/* ============ 舞台 ============ */
#stage{
  position:relative;z-index:1;flex:1 1 auto;min-height:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#charSvg{width:100%;height:100%;max-height:100%}
#char{transform-origin:150px 452px;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.7deg) translateY(0)}50%{transform:rotate(.7deg) translateY(-4px)}}
.eyes-open{animation:blink 5.6s infinite}
.eyes-closed{opacity:0;animation:blinkInv 5.6s infinite}
@keyframes blink{0%,93.5%,100%{opacity:1}95%,97.5%{opacity:0}}
@keyframes blinkInv{0%,93.5%,100%{opacity:0}95%,97.5%{opacity:1}}

/* 换装时的弹入 */
.pop{animation:pop .42s cubic-bezier(.34,1.56,.64,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{opacity:0;transform:scale(.82)}62%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}

/* 舞台上的浮动标签 */
#fitBadge{
  position:absolute;top:6px;left:50%;transform:translateX(-50%) translateY(-40px);
  padding:5px 14px;border-radius:16px;background:rgba(255,255,255,.9);
  border:1.5px solid #f3c9dd;font-size:12.5px;font-weight:800;color:#c33f7c;
  box-shadow:0 4px 14px rgba(200,80,150,.16);opacity:0;transition:.35s;white-space:nowrap;
}
#fitBadge.on{opacity:1;transform:translateX(-50%) translateY(0)}
#fitBadge b{color:#8a4fd0}

/* 火花粒子 */
.spark{position:absolute;pointer-events:none;z-index:9;font-size:14px;animation:sparkUp .9s ease-out forwards}
@keyframes sparkUp{
  0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--rt))}
}
/* 全屏闪光 */
#flash{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.96),rgba(255,214,238,.55) 40%,rgba(255,255,255,0) 72%)}
#flash.go{animation:flashA .52s ease-out}
@keyframes flashA{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

/* ============ 选择面板 ============ */
#panel{
  position:relative;z-index:5;flex:0 0 auto;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.9);
  box-shadow:0 -6px 24px rgba(160,100,150,.10);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
#tabs{display:flex;gap:2px;padding:7px 6px 5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:6px 12px;border-radius:13px;font-size:13px;font-weight:700;color:#9a7190;
  background:rgba(255,255,255,.5);border:1px solid transparent;transition:.18s;position:relative;
}
.tab.on{color:#fff;background:linear-gradient(120deg,#f4709c,#a862dd);box-shadow:0 3px 10px rgba(190,80,160,.32)}
.tab .bdg{position:absolute;top:-3px;right:-2px;width:8px;height:8px;border-radius:50%;background:#4cd07d;border:1.5px solid #fff}

#items{
  display:flex;gap:8px;padding:2px 10px 9px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;min-height:96px;align-items:flex-start;
}
#items::-webkit-scrollbar{display:none}
.it{
  flex:0 0 auto;width:66px;border-radius:14px;background:#fff;border:2px solid #f4e3ee;
  padding:4px 4px 5px;transition:.16s;position:relative;overflow:hidden;
}
.it:active{transform:scale(.94)}
.it.on{border-color:#ef6fa0;background:linear-gradient(160deg,#fff2f8,#f6ecff);box-shadow:0 4px 12px rgba(220,90,160,.24)}
.it.on::after{content:"✓";position:absolute;top:2px;right:3px;width:15px;height:15px;border-radius:50%;
  background:#ef6fa0;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center}
.it .th{width:58px;height:58px;border-radius:10px;background:#fbf4f8;overflow:hidden;display:grid;place-items:center}
.it .th svg{width:100%;height:100%}
.it .nm{font-size:10.5px;text-align:center;color:#7d5a76;margin-top:3px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.it.on .nm{color:#c93f7d}
.it .tg{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  font-size:8.5px;padding:1px 5px;border-radius:7px;background:rgba(239,111,160,.14);color:#d14a86;font-weight:800;white-space:nowrap}
.sw{width:58px;height:58px;border-radius:10px;position:relative;overflow:hidden}
.sw i{position:absolute;inset:0;display:block}

/* ============ 底部操作栏 ============ */
#bar{
  position:relative;z-index:5;flex:0 0 auto;display:flex;gap:7px;padding:8px 12px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.55));
}
.btn{
  flex:1;height:44px;border-radius:15px;font-size:14px;font-weight:800;letter-spacing:.4px;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:.14s;
  background:#fff;color:#8d5f84;border:1.5px solid #f0d8e7;box-shadow:0 3px 10px rgba(170,110,150,.10);
}
.btn:active{transform:scale(.955)}
.btn.pri{background:linear-gradient(120deg,#ff7fa8,#b06fe8);color:#fff;border-color:transparent;
  box-shadow:0 5px 16px rgba(200,80,170,.36)}
.btn.dark{background:linear-gradient(120deg,#4a3550,#6d4a80);color:#fff;border-color:transparent}
.btn.sm{font-size:12.5px;height:38px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ============ 弹窗 ============ */
#mask{
  position:fixed;inset:0;z-index:50;background:rgba(58,32,58,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:22px 18px;
  padding-top:calc(22px + env(safe-area-inset-top,0px));
}
#mask.on{display:flex;animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#modal{
  width:100%;max-width:400px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#fff;border-radius:24px;padding:22px 20px 20px;
  box-shadow:0 20px 60px rgba(60,20,60,.32);animation:rise .3s cubic-bezier(.34,1.4,.64,1);
}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1;transform:none}}
#modal h2{font-size:19px;font-weight:900;text-align:center;color:#4a2f4c;margin-bottom:4px}
#modal .sub{font-size:12.5px;text-align:center;color:#a3839c;margin-bottom:14px;line-height:1.6}
.mrow{display:flex;gap:8px;margin-top:14px}
.mrow .btn{height:42px}
.x{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;background:#f6edf3;
  color:#a3839c;font-size:15px;display:grid;place-items:center;font-weight:700}
#modal{position:relative}

/* 场景卡 */
.scard{
  border-radius:18px;padding:16px;margin:6px 0 4px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#f4709c,#a862dd);box-shadow:0 8px 22px rgba(190,80,170,.3);
}
.scard .emo{font-size:34px;line-height:1;margin-bottom:8px}
.scard .ttl{font-size:18px;font-weight:900;letter-spacing:1px;margin-bottom:5px}
.scard .dsc{font-size:12.5px;line-height:1.65;opacity:.94}
.scard .tagline{margin-top:10px;display:inline-block;padding:3px 11px;border-radius:11px;
  background:rgba(255,255,255,.24);font-size:11.5px;font-weight:800;letter-spacing:.5px}

/* 结算 */
.stars{text-align:center;font-size:40px;letter-spacing:6px;margin:2px 0 8px;color:#ffc93c;text-shadow:0 3px 10px rgba(255,180,40,.4)}
.stars .off{color:#eadfe8;text-shadow:none}
.scorebox{text-align:center;margin-bottom:6px}
.scorebox .big{font-size:46px;font-weight:900;line-height:1;
  background:linear-gradient(120deg,#f4709c,#a862dd);-webkit-background-clip:text;background-clip:text;color:transparent}
.scorebox .lb{font-size:11.5px;color:#a3839c;margin-top:4px;letter-spacing:2px}
.titleCard{text-align:center;padding:12px;border-radius:16px;margin:12px 0;
  background:linear-gradient(135deg,#fff1f7,#f2ecff);border:1px solid #f6dcec}
.titleCard .t1{font-size:11px;color:#b18aa8;letter-spacing:3px;margin-bottom:4px}
.titleCard .t2{font-size:22px;font-weight:900;color:#c33f7c;letter-spacing:2px}
.brk{font-size:12px;color:#8d6d86;line-height:1.9;padding:0 4px}
.brk div{display:flex;justify-content:space-between;border-bottom:1px dashed #f2e4ee;padding:3px 0}
.brk span:last-child{font-weight:800;color:#b0479a}
.brk .miss{color:#c3b0bd}
.brk .miss span:last-child{color:#c3b0bd}

/* 海报 */
#posterBox{text-align:center}
#posterImg{width:100%;max-width:290px;border-radius:16px;box-shadow:0 10px 30px rgba(120,60,120,.28);margin:0 auto}
.hint{font-size:11.5px;color:#a3839c;line-height:1.7;text-align:center;margin-top:11px;
  background:#fdf5f9;border-radius:12px;padding:9px 11px}
.hint b{color:#d14a86}
.linkbox{width:100%;border:1.5px dashed #eec9dc;border-radius:12px;padding:9px 11px;font-size:11.5px;
  color:#8d5f84;background:#fffafc;word-break:break-all;line-height:1.55;text-align:left;
  -webkit-user-select:text;user-select:text}

/* 帮助列表 */
.hl{font-size:12.8px;color:#6f5470;line-height:1.85}
.hl b{color:#c33f7c}
.hl .step{display:flex;gap:9px;margin-bottom:9px;align-items:flex-start}
.hl .n{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#f4709c,#a862dd);
  color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;margin-top:2px}
.rule{border-top:1px solid #f6e9f1;margin:13px 0;padding-top:12px}
.kv{display:flex;justify-content:space-between;font-size:12px;color:#8d6d86;padding:3px 0}
.kv b{color:#b0479a}

/* 开场动画 */
#boot{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#fff2f7,#f0e6fd);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#boot.hide{opacity:0;pointer-events:none}
#boot .bt{font-size:27px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(120deg,#e8628f,#a35fd0);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .bs{font-size:12px;color:#b395ab;letter-spacing:2px}
#boot .ld{width:120px;height:4px;border-radius:2px;background:#f0dcec;overflow:hidden}
#boot .ld i{display:block;height:100%;width:30%;border-radius:2px;background:linear-gradient(90deg,#ff7fa8,#b06fe8);animation:ldm 1.1s ease-in-out infinite}
@keyframes ldm{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}

@media (max-height:640px){
  .it{width:58px}.it .th,.sw{width:50px;height:50px}#items{min-height:84px}
  .btn{height:40px;font-size:13px}
}
@media (max-width:360px){
  .logo{font-size:14.5px;letter-spacing:0}
  .chip{padding:0 8px;font-size:11.5px}
}
</style>
</head>

/* ---------- 小工具 ---------- */
function $(id){ return document.getElementById(id); }
function ri(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[ri(a.length)]; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- 音效（WebAudio 合成，无外部文件） ---------- */
function actx(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==="suspended"){ try{AC.resume();}catch(e){} }
  return AC;
}
function tone(f,d,type,v,delay){
  if(muted) return; var a=actx(); if(!a) return;
  try{
    var t0=a.currentTime+(delay||0);
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(v||0.10,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+0.03);
  }catch(e){}
}
function sfx(k){
  if(muted) return;
  if(k==="tap")      tone(760,0.07,"triangle",0.07);
  else if(k==="pick"){ tone(880,0.09,"sine",0.09); tone(1320,0.10,"sine",0.05,0.045); }
  else if(k==="spin")tone(520+ri(500),0.05,"square",0.035);
  else if(k==="flash"){ tone(660,0.16,"sine",0.10); tone(990,0.20,"sine",0.08,0.07); tone(1320,0.26,"sine",0.07,0.15); }
  else if(k==="tick")tone(1200,0.04,"square",0.045);
  else if(k==="win"){ [523,659,784,1046].forEach(function(f,i){ tone(f,0.26,"triangle",0.09,i*0.09); }); }
  else if(k==="lose"){ [440,392,330].forEach(function(f,i){ tone(f,0.24,"sine",0.08,i*0.11); }); }
}

/* ---------- 主渲染 ---------- */
function render(anim){
  var mk = LIB.makeup[S.makeup], h = LIB.hair[S.hair], t = LIB.top[S.top];
  var b = LIB.bottom[S.bottom], sh = LIB.shoe[S.shoe], ac = LIB.acc[S.acc], bgm = LIB.bg[S.bg];
  var M = hmap();
  function L(name, inner){ return inner ? "<g id='L_"+name+"'"+(anim===name?" class='pop'":"")+">"+inner+"</g>" : ""; }
  var skin = "fill='url(#skinG)'";

  $("cdefs").innerHTML = SHARED_DEFS + bgm.defs +
    "<linearGradient id='skinG' gradientUnits='userSpaceOnUse' x1='150' y1='28' x2='150' y2='462'>"+
      "<stop offset='0' stop-color='"+mk.skin+"'/><stop offset='.62' stop-color='"+mk.skin+"'/><stop offset='1' stop-color='"+mk.skin2+"'/></linearGradient>";

  var out = "";
  out += L("bg", bgm.svg);
  out += (ac.behind ? L("accB", repl(ac.svg,M)) : "");
  out += L("hairB", repl(h.back,M));
  out += L("legs",
      "<path d='"+BODY.leg_l+"' "+skin+"/><path d='"+BODY.leg_r+"' "+skin+"/>"+
      "<path d='"+BODY.foot_l+"' "+skin+"/><path d='"+BODY.foot_r+"' "+skin+"/>"+
      "<path d='M119,300 C130,306 140,306 149,300' stroke='"+mk.skin2+"' stroke-width='1.2' fill='none' opacity='.45'/>"+
      "<path d='M151,300 C160,306 170,306 181,300' stroke='"+mk.skin2+"' stroke-width='1.2' fill='none' opacity='.45'/>");
  out += L("shoe", sh.svg);
  if(!topIsLong()) out += L("bottom", b.svg);
  out += L("body", "<path d='"+BODY.torso+"' "+skin+"/><path d='"+BODY.neck+"' "+skin+"/>"+
      "<path d='M137,140 C143,146 157,146 163,140' stroke='"+mk.skin2+"' stroke-width='1.4' fill='none' opacity='.5'/>");
  out += L("arms", "<path d='"+BODY.arm_l+"' "+skin+"/><path d='"+BODY.arm_r+"' "+skin+"/>");
  out += L("top", repl(t.svg,M));
  out += L("hands", "<path d='"+BODY.hand_l+"' "+skin+"/><path d='"+BODY.hand_r+"' "+skin+"/>");

function thumb(cat, it){
  var mk = LIB.makeup[S.makeup], M = hmap(), vb, inner;
  if(cat==="hairColor"){
    return "<div class='sw'><i style='background:linear-gradient(150deg,"+it.c1+" 0 52%,"+it.c2+" 52% 100%)'></i></div>";
  }
  if(cat==="hair"){ vb=CAT_VB.hair; inner=ghostHead(mk)+repl(it.back,M)+repl(it.front,M); }
  else if(cat==="makeup"){ vb=CAT_VB.makeup;
    inner="<path d='"+BODY.face+"' fill='"+it.skin+"'/>"+faceSVG(it); }
  else if(cat==="bg"){ vb=CAT_VB.bg; inner="<defs>"+it.defs+"</defs>"+it.svg; }
  else if(cat==="acc"){ vb=it.vb||"90 10 120 120";
    inner=(it.behind?"":ghostHead(mk))+repl(it.svg,M); }
  else if(cat==="top"){ vb=CAT_VB.top; inner=ghostBody(mk)+repl(it.svg,M); }
  else if(cat==="bottom"){ vb=CAT_VB.bottom; inner=ghostLegs(mk)+it.svg; }
  else { vb=CAT_VB.shoe; inner=ghostFeet(mk)+it.svg; }
  return "<svg viewBox='"+vb+"' preserveAspectRatio='xMidYMid meet' xmlns='http://www.w3.org/2000/svg'><defs>"+SHARED_DEFS+"</defs>"+inner+"</svg>";
}

/* ---------- 分类面板 ---------- */
function buildTabs(){
  var h="";
  CATS.forEach(function(c){
    var locked = (c==="bottom" && topIsLong());
    h+="<button class='tab"+(c===curCat?" on":"")+(locked?" lk":"")+"' data-c='"+c+"'>"+CAT_NAME[c]+(locked?" 🔒":"")+"</button>";
  });
  $("tabs").innerHTML=h;
  Array.prototype.forEach.call($("tabs").children,function(el){
    el.onclick=function(){ sfx("tap"); curCat=el.getAttribute("data-c"); buildTabs(); buildItems(); };
  });
}
function tagBadge(it){
  if(!it.tags || !it.tags.length) return "";
  var tg=it.tags[0], m=LIB.tagMeta[tg];
  return m ? "<span class='tg'>"+m.emo+tg+"</span>" : "";
}
function buildItems(){
  var box=$("items"), h="", mk=LIB.makeup[S.makeup];
  if(curCat==="bottom" && topIsLong()){
    box.innerHTML="<div style='padding:22px 10px;font-size:12.5px;color:#a3839c;line-height:1.7;text-align:center;width:100'>"+
      "👗 当前上身是<b style='color:#c33f7c'>连衣裙 / 长袍</b>，已包含下摆<br><span style='font-size:11.5px'>换一件短款上衣即可单独搭配下装</span></div>";
    return;
  }
  var list = LIB[curCat];
  list.forEach(function(it,i){
    var on = (S[curCat]===i);
    h+="<button class='it"+(on?" on":"")+"' data-i='"+i+"'>"+
        "<div class='th'>"+thumb(curCat,it)+"</div>"+
        tagBadge(it)+
        "<div class='nm'>"+esc(it.name)+"</div></button>";
  });
  box.innerHTML=h;
  Array.prototype.forEach.call(box.children,function(el){
    if(!el.getAttribute) return;
    el.onclick=function(){ select(curCat, +el.getAttribute("data-i")); };
  });
  var sel=box.querySelector(".it.on");
  if(sel) box.scrollLeft = Math.max(0, sel.offsetLeft - box.clientWidth/2 + 33);
}
function select(cat, i){
  if(S[cat]===i) return;
  S[cat]=i; sfx("pick");
  var anim = (cat==="hair"||cat==="hairColor") ? "hairF"
           : cat==="top" ? "top" : cat==="bottom" ? "bottom"
           : cat==="shoe" ? "shoe" : cat==="acc" ? (LIB.acc[i].behind?"accB":"acc")
           : cat==="makeup" ? "head" : "bg";
  render(anim);
  if(cat==="top") buildTabs();
  buildItems();
  miniSpark(5);
  if(chal) updateFit();
  pushState();
}

/* ---------- 特效 ---------- */
function miniSpark(n){
  var st=$("stage"), r=st.getBoundingClientRect();
  var emo=["✦","✧","♡","⋆","✩"];
  for(var i=0;i<n;i++){
    var d=document.createElement("div");
    d.className="spark"; d.textContent=pick(emo);
    d.style.left=(r.width*0.28+Math.random()*r.width*0.44)+"px";
    d.style.top=(r.height*0.22+Math.random()*r.height*0.5)+"px";

function scoreSlots(){
  var slots=["hair","top","shoe","acc","makeup"];
  if(!topIsLong()) slots.push("bottom");
  return slots;
}
function fitInfo(){
  var tag=chal.sc.tag, slots=scoreSlots(), hit=0;
  slots.forEach(function(c){
    var it=LIB[c][S[c]];
    if(c==="acc" && S.acc===LIB.acc.length-1) return;   /* 无配饰不计 */
    if(it && it.tags && it.tags.indexOf(tag)>=0) hit++;
  });
  return {hit:hit, total:slots.length, tag:tag};
}
function updateFit(){
  if(!chal) return;
  var f=fitInfo(), m=LIB.tagMeta[f.tag];
  toast(m.emo+" "+f.tag+" 契合 <b>"+f.hit+"</b> / "+f.total);
}
function finishChal(manual){
  if(!chal || chal.done) return;

  var f=fitInfo(), tag=f.tag;

  var total=f.total;
  if(S.acc===LIB.acc.length-1) total=Math.max(1,total-1);
  var per=Math.round(600/total);

  var tb=Math.max(0,chal.left)*3;
  var score=base+tb;
  var stars = score>=640?3 : score>=430?2 : 1;
  var title = pick(TITLES[tag]);

    rows+="<div class='"+(ok?"":"miss")+"'><span>"+nameMap[c]+" · "+esc(it.name)+"</span><span>"+(ok?"✓ +":"✗ +")+(ok?per:0)+"</span></div>";
  });

    "<div class='sub'>"+chal.sc.emo+" "+chal.sc.title+" · 目标风格【"+tag+"】</div>"+

    "<div class='scorebox'><div class='big'>"+score+"</div><div class='lb'>TOTAL SCORE</div></div>"+
    "<div class='titleCard'><div class='t1'>你 的 称 号</div><div class='t2'>"+m.emo+" "+title+"</div></div>"+
    "<div class='brk'>"+rows+"<div><span style='color:#b0479a;font-weight:800'>合计</span><span>"+score+" / 780</span></div></div>"+
    "<div class='mrow'><button class='btn' id='rAgain'>🔄 再来一局</button><button class='btn pri' id='rPost'>📸 存为海报</button></div>"+
    "<div class='mrow'><button class='btn sm' id='rFree' style='flex:1'>回到自由变装</button></div>",
    function(){
      $("rAgain").onclick=function(){ closeModal(); openChallenge(); };
      $("rPost").onclick=function(){ closeModal(); makePoster(title, score, stars); };

function makePoster(title, score, stars){
  sfx("tap");
  var svgEl=$("charSvg");
  var clone=svgEl.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("width","600"); clone.setAttribute("height","940");
  clone.removeAttribute("id"); clone.removeAttribute("style");
  var g=clone.querySelector("#char"); if(g) g.removeAttribute("style");
  var str=new XMLSerializer().serializeToString(clone);
  var url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(str);

  var cw=750, ch=1240;
  var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
  var x=cv.getContext("2d");
  var img=new Image();
  img.onload=function(){
    var gr=x.createLinearGradient(0,0,cw*0.35,ch);
    gr.addColorStop(0,"#fff4f8"); gr.addColorStop(0.5,"#fdeef5"); gr.addColorStop(1,"#eee2fb");
    x.fillStyle=gr; x.fillRect(0,0,cw,ch);
    x.globalAlpha=0.5;
    [["#ffd9e8",86,150,120],["#d9d0ff",676,240,104],["#cfe4ff",70,860,96],["#ffe3d0",690,960,120]].forEach(function(c){
      x.fillStyle=c[0]; x.beginPath(); x.arc(c[1],c[2],c[3],0,7); x.fill();
    });
    x.globalAlpha=1;
    x.textAlign="center";
    x.fillStyle="#c33f7c"; x.font='900 56px "PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText("百 变 衣 橱", cw/2, 104);
    x.fillStyle="#b18aa8"; x.font='600 22px "PingFang SC",sans-serif';
    x.fillText("D R E S S   U P   ·   我 的 变 装 作 品", cw/2, 140);
    x.strokeStyle="#f3c9dd"; x.lineWidth=3;
    x.beginPath(); x.moveTo(150,166); x.lineTo(600,166); x.stroke();

    var dw=560, dh=Math.round(dw*470/300), dx=(cw-dw)/2, dy=190;
    x.drawImage(img,dx,dy,dw,dh);

    var by=dy+dh+18;
    if(title){
      x.fillStyle="#ffffff"; rr(x,105,by,540,112,26); x.fill();
      x.strokeStyle="#f6dcec"; x.lineWidth=2; rr(x,105,by,540,112,26); x.stroke();
      x.fillStyle="#b18aa8"; x.font='700 22px "PingFang SC",sans-serif';
      x.fillText("我 的 称 号", cw/2, by+38);
      x.fillStyle="#c33f7c"; x.font='900 44px "PingFang SC","Microsoft YaHei",sans-serif';
      x.fillText(title, cw/2, by+86);
      x.fillStyle="#ffc93c"; x.font='900 34px sans-serif';
      var st=""; for(var i=0;i<3;i++) st += i<stars?"★":"☆";
      x.fillText(st, cw/2, by+150);
      x.fillStyle="#8d6d86"; x.font='700 26px "PingFang SC",sans-serif';
      x.fillText("得分 "+score+" / 780", cw/2, by+192);
      by+=210;
    }
    x.fillStyle="#a3839c"; x.font='600 22px "PingFang SC",sans-serif';
    x.fillText("长按二维码 / 保存图片，发给朋友一起玩", cw/2, ch-72);
    x.fillStyle="#c9a8bd"; x.font='600 19px "PingFang SC",sans-serif';
    x.fillText(new Date().toLocaleDateString("zh-CN")+" · 李文静的百变衣橱", cw/2, ch-40);

    var data;
    try{ data=cv.toDataURL("image/png"); }catch(e){ data=null; }
    if(!data){ modal("<h2>生成失败</h2><div class='sub'>当前浏览器不支持图片导出，可以直接截图分享～</div><div class='mrow'><button class='btn pri' id='ok1'>好的</button></div>",function(){ $("ok1").onclick=closeModal; }); return; }
    modal("<h2>📸 你的变装海报</h2><div class='sub'>长按图片 → 保存到手机 / 发送给朋友</div>"+
      "<div id='posterBox'><img id='posterImg' src='"+data+"' alt='变装海报'></div>"+
      "<div class='hint'>微信里<b>长按图片</b>即可「发送给朋友」或「保存到相册」<br>保存后可直接发朋友圈 / 微信群</div>"+
      "<div class='mrow'><button class='btn' id='pLink'>🔗 复制游戏链接</button><button class='btn pri' id='pClose'>完成</button></div>",
      function(){ $("pClose").onclick=closeModal; $("pLink").onclick=shareLink; });
    sfx("win");
  };
  img.onerror=function(){
    modal("<h2>生成失败</h2><div class='sub'>图片渲染异常，请直接截屏分享～</div><div class='mrow'><button class='btn pri' id='ok2'>好的</button></div>",function(){ $("ok2").onclick=closeModal; });
  };
  img.src=url;
}
function rr(x,a,b,w,h,r){
  x.beginPath(); x.moveTo(a+r,b); x.lineTo(a+w-r,b); x.quadraticCurveTo(a+w,b,a+w,b+r);
  x.lineTo(a+w,b+h-r); x.quadraticCurveTo(a+w,b+h,a+w-r,b+h); x.lineTo(a+r,b+h);
  x.quadraticCurveTo(a,b+h,a,b+h-r); x.lineTo(a,b+r); x.quadraticCurveTo(a,b,a+r,b); x.closePath();
}

  var lim={hair:LIB.hair.length,hairColor:LIB.hairColor.length,top:LIB.top.length,bottom:LIB.bottom.length,
           shoe:LIB.shoe.length,acc:LIB.acc.length,makeup:LIB.makeup.length,bg:LIB.bg.length};
  var o={},i,k,keys=["hair","hairColor","top","bottom","shoe","acc","makeup","bg"];
  for(i=0;i<8;i++){ k=keys[i]; var v=parseInt(a[i],10); if(isNaN(v)||v<0||v>=lim[k]) return false; o[k]=v; }
  for(k in o) S[k]=o[k];
  return true;
}
function pushState(){ try{ history.replaceState(null,"","#o="+enc()); }catch(e){ try{ location.hash="o="+enc(); }catch(e2){} } }
function pullState(){
  try{
    var h=location.hash||"", m=h.match(/o=([\d\-]+)/);
    if(m && dec(m[1])) return true;
  }catch(e){}
  return false;
}

/* ---------- 事件绑定 ---------- */
function bind(){
  $("btnRand").onclick=function(){ if(chal){ toast("⏱ 挑战中也能随机哦"); } smartRandom(); };
  $("btnChal").onclick=function(){ if(chal && !chal.done) finishChal(true); else openChallenge(); };
  $("btnPoster").onclick=function(){ makePoster(null,0,0); };
  $("modeChip").onclick=function(){ if(chal && !chal.done) finishChal(true); };
  $("btnHelp").onclick=openHelp;
  $("btnSound").onclick=function(){
    muted=!muted; sfx("pick");
    $("btnSound").textContent=muted?"🔇":"🔊";
    $("btnSound").classList.toggle("off",muted);
    try{ localStorage.setItem("dz_muted",muted?"1":"0"); }catch(e){}
  };
  document.addEventListener("touchstart",function once(){ actx(); document.removeEventListener("touchstart",once); },{passive:true});
  document.addEventListener("click",function once2(){ actx(); document.removeEventListener("click",once2); });
  window.addEventListener("hashchange",function(){ if(pullState()){ render(); buildTabs(); buildItems(); } });
}

/* ---------- 启动 ---------- */
function boot(){
  document.body.insertAdjacentHTML("afterbegin",
    "<svg width='0' height='0' style='position:absolute;left:-9999px' aria-hidden='true'><defs>"+SHARED_DEFS+"</defs></svg>");
  var st=document.createElement("style");
  st.textContent="html,body{overscroll-behavior:none;overscroll-behavior-y:contain}#stage{-webkit-user-select:none}";
  document.head.appendChild(st);

  try{ muted = localStorage.getItem("dz_muted")==="1"; }catch(e){}
  $("btnSound").textContent=muted?"🔇":"🔊";
  $("btnSound").classList.toggle("off",muted);

  if(!pullState()){ S={hair:0,hairColor:1,top:3,bottom:1,shoe:3,acc:1,makeup:1,bg:7}; }
  render(); buildTabs(); buildItems(); bind(); pushState();

  setTimeout(function(){
    $("boot").classList.add("hide");
    setTimeout(function(){ var b=$("boot"); if(b&&b.remove) b.remove(); },560);
    setTimeout(function(){ toast("👋 点下方分类开始变装"); },500);
  },620);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
</script>
